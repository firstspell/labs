<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
    <script src="cube-component.js"></script>
  </head>
  <body>
    <!-- <audio src="assets/audio/sample.mp3" autoplay>
      <p>
        If you are reading this, it is because your browser does not support the
        audio element.
      </p>
    </audio> -->
    <a-scene>
      <a-assets>
        <img
          id="boxTexture"
          crossorigin="anonymous"
          src="https://i.imgur.com/mYmmbrp.jpg"
        />
        <img
          id="skyTexture"
          crossorigin="anonymous"
          src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg"
        />
        <img
          id="groundTexture"
          crossorigin="anonymous"
          src="https://cdn.aframe.io/a-painter/images/floor.jpg"
        />
        <audio
          id="naturesound"
          crossorigin="anonymous"
          src="assets/audio/sample.mp3"
        ></audio>
      </a-assets>
      <a-box
        src="#boxTexture"
        position="2 1 -7"
        rotation="0 45 60"
        scale="1 1 1"
        animation="property: object3D.position.y; to: 2.2; dir: alternate; dur: 2000; loop: true"
      ></a-box>

      <a-sound id="naturebg" src="#naturesound" position="-3 1 -4"></a-sound>

      <a-entity
        text="value: Hello, A-Frame!; color: #BBB"
        position="-0.9 0.2 -3"
        scale="2 2 2"
      ></a-entity>

      <!-- <a-entity cube="color: green; size: 20"></a-entity> -->
      <a-entity
        id="box"
        position="0 2 -8"
        rotation="0 45 45"
        scale="2 2 2"
        geometry="primitive: box"
        material="color: red"
        animation="property: object3D.position.y;easing: linear;dir: alternate; dur: 2000; loop: true"
      >
      </a-entity>
      <a-entity
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0 ; loop: true; dur: 10000"
      >
        <a-sphere position="5 0 0" color="mediumseagreen"></a-sphere>
      </a-entity>
      <a-entity
        cube
        geometry="primitive: box; width: 5"
        position="0 4 -8"
        rotation="0 45 45"
        material="color: white"
      ></a-entity>

      <!-- <a-sky src="#skyTexture"></a-sky>
      <a-plane
        src="#groundTexture"
        rotation="-90 0 0"
        width="30"
        height="30"
      ></a-plane>
      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" intensity="2" position="2 4 4"></a-light> -->
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
      <!-- Out of the box environment! -->
      <a-entity environment="preset: forest; dressingAmount: 500;"></a-entity>
    </a-scene>
  </body>
</html>
