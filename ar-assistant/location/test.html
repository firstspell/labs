<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <audio src="./assets/audio/sample.mp3" autoplay>
      <p>
        If you are reading this, it is because your browser does not support the
        audio element.
      </p>
    </audio>
    <a-scene>
      <a-assets>
        <img id="boxTexture" src="https://i.imgur.com/mYmmbrp.jpg" />
        <img
          id="skyTexture"
          src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg"
        />
        <img
          id="groundTexture"
          src="https://cdn.aframe.io/a-painter/images/floor.jpg"
        />
        <audio src="./assets/audio/sample.mp3" autoplay preload></audio>
      </a-assets>
      <!-- <a-box position="0 2 -3" rotation="0 0 0" color="#4CC3D9"></a-box> -->
      <!-- <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder
        position="1 0.75 -3"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      ></a-cylinder>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
      ></a-plane>
      <a-sky color="#ECECEC"></a-sky> -->
      <a-box
        src="#boxTexture"
        position="2 1 -7"
        rotation="0 45 60"
        scale="1 1 1"
        animation="property: object3D.position.y; to: 2.2; dir: alternate; dur: 2000; loop: true"
      ></a-box>

      <a-sound
        src="ar-assistant/location/assets/audio/sample.mp3"
        autoplay="true"
        position="-3 1 -4"
      ></a-sound>

      <a-entity
        text="value: Hello, A-Frame!; color: #BBB"
        position="-0.9 0.2 -3"
        scale="2 2 2"
      ></a-entity>

      <a-entity
        id="box"
        position="0 2 -8"
        rotation="0 45 45"
        scale="2 2 2"
        geometry="primitive: box"
        material="color: red"
        animation="property: object3D.position.y;easing: linear;dir: alternate; dur: 2000; loop: true"
      >
      </a-entity>
      <a-entity
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0 ; loop: true; dur: 10000"
      >
        <a-sphere position="5 0 0" color="mediumseagreen"></a-sphere>
      </a-entity>
      <!-- <a-sky src="#skyTexture"></a-sky>
      <a-plane
        src="#groundTexture"
        rotation="-90 0 0"
        width="30"
        height="30"
      ></a-plane>
      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" intensity="2" position="2 4 4"></a-light> -->
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
      <!-- Out of the box environment! -->
      <a-entity environment="preset: forest; dressingAmount: 500;"></a-entity>
    </a-scene>
  </body>
</html>
