<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GeoAR.js demo</title>
    <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/jeromeetienne/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script>
      THREEx.ArToolkitContext.baseURL =
        "https://raw.githack.com/jeromeetienne/ar.js/master/three.js/";
    </script>
    <script src="./script.js"></script>
    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>

  <body style="margin: 0; overflow: hidden">
    <div class="centered instructions"></div>
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;"
    >
      <!-- Specify the height of the display -->
      <!-- <a-marker type="nft" url="path/to/your-marker.nft" displayHeight="0.1">
        <a-box
          position="0 0.05 0"
          width="0.1"
          height="0.1"
          depth="0.1"
          color="red"
        ></a-box>
      </a-marker> -->
      <a-entity
        gps-entity-place="latitude: 13.0813839; longitude: 77.6392583;"
        gltf-model="./assets/flamingosf/scene.gltf"
        rotation="0 180 0"
        animation-mixer
        scale="0.15 0.15 0.15"
      />
      <a-entity
        gps-entity-place="latitude: 13.0813613; longitude: 77.6392601;"
        gltf-model="./assets/magnemite/scene.gltf"
        rotation="0 180 0"
        animation-mixer
        scale="0.15 0.15 0.15"
      />
      <a-entity
        gps-entity-place="latitude: 13.081463237818527; longitude: 77.63928402103014;"
        gltf-model="./assets/magnemite/scene.gltf"
        rotation="0 180 0"
        animation-mixer
        scale="0.15 0.15 0.15"
      />
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>
    <div class="centered">
      <button data-action="change"></button>
      <span id="help-text"></span>
    </div>
  </body>
</html>
