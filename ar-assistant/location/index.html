<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GeoAR.js demo</title>
    <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/jeromeetienne/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script>
      THREEx.ArToolkitContext.baseURL =
        "https://raw.githack.com/jeromeetienne/ar.js/master/three.js/";
    </script>
    <script src="./script.js"></script>
    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>

  <body style="margin: 0; overflow: hidden">
    <div class="centered instructions"></div>
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      loading-screen="enabled: true;"
      arjs="sourceType: webcam;debugUIEnabled: false;"
      renderer="logarithmicDepthBuffer: true;"
    >
      <!-- Specify the height of the display -->
      <!-- <a-marker type="nft" url="path/to/your-marker.nft" displayHeight="0.1">
        <a-box
          position="0 0.05 0"
          width="0.1"
          height="0.1"
          depth="0.1"
          color="red"
        ></a-box>
      </a-marker> -->
      <a-assets>
        <a-asset-item
          id="flamingosf-asset"
          src="./assets/flamingosf/scene.gltf"
        ></a-asset-item>
        <a-asset-item
          id="magnemite-asset"
          src="./assets/magnemite/scene.gltf"
        ></a-asset-item>
      </a-assets>

      <a-entity
        look-at="[gps-camera]"
        gps-entity-place="latitude: 13.0813839; longitude: 77.6392583;"
        gltf-model="#flamingosf-asset"
        animation-mixer="loop: repeat"
        scale="0.6488225300829227 0.6488225300829227 0.6488225300829227"
      />
      <a-entity
        look-at="[gps-camera]"
        gps-entity-place="latitude: 13.0813613; longitude: 77.6392601;"
        gltf-model="#magnemite-asset"
        animation-mixer="loop: repeat"
        scale="0.6488225300829227 0.6488225300829227 0.6488225300829227"
      />
      <a-entity
        look-at="[gps-camera]"
        gps-entity-place="latitude: 13.081463237818527; longitude: 77.63928402103014;"
        gltf-model="#magnemite-asset"
        animation-mixer="loop: repeat"
        scale="0.6488225300829227 0.6488225300829227 0.6488225300829227"
      />
      <a-camera
        gps-camera
        rotation-reader
        alert="true"
        minDistance="2"
      ></a-camera>
    </a-scene>
    <div class="centered">
      <button data-action="change"></button>
      <span id="help-text"></span>
    </div>
  </body>
</html>
